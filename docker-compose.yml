services:
  apigateway:
    image: ${DOCKER_REGISTRY-}apigateway
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    ports:
      - "5006:5006"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5006
    depends_on:
      - workflow
      - liqpayproviderservice
      - signalrproviderservice

  workflow:
    image: ${DOCKER_REGISTRY-}workflow
    build:
      context: .
      dockerfile: Workflow/Dockerfile
    ports:
      - "5004:5004"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5004
    depends_on:
      mongo:
          condition: service_healthy
      rabbitmq:
          condition: service_healthy
  signalrproviderservice:
    image: ${DOCKER_REGISTRY-}signalrproviderservice
    build:
      context: .
      dockerfile: SignalRProviderService/Dockerfile
    ports:
      - "5007:5007"
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
        
    environment:
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - ASPNETCORE_URLS=http://0.0.0.0:5007
      
  liqpayproviderservice:
    image: ${DOCKER_REGISTRY-}liqpayproviderservice
    build:
      context: .
      dockerfile: LiqPayProviderService/Dockerfile
    depends_on:
      mongo:
          condition: service_healthy
      rabbitmq:
          condition: service_healthy
        
    env_file:
      - .env
    environment:
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - ConnectionStrings__MongoConnection=mongodb://mongo:27017
      - MongoDatabaseName=workflowdb
      - WebhookOptions__URL=https://aqueous-worrisome-lasandra.ngrok-free.dev

  mongo:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=workflowdb
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management
    ports:
      - "5672:5672"   # RabbitMQ default port
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mongo-data:

